<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>美股持仓账本</title>
<style>
/* Layout: one centred card; tabs switch between signing in and signing up, a link opens the reset-code form */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --ink: #16202A; --muted: #5D6A77; --line: #D3DAE1;
  --accent: #2B5784; --accent-soft: #E3EBF4; --on-accent: #FFFFFF; --warn: #9A6400;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161C; --surface: #19212A; --ink: #E5EAF0; --muted: #95A2AF; --line: #2B3540; --accent: #82ABDA; --accent-soft: #1F2D3C; --on-accent: #0E1620; --warn: #E0A84A; color-scheme: dark; }
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
main { width: min(100%, 380px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 24px; font-weight: 600; }
p { margin: 0; color: var(--muted); font-size: 13px; }
a { color: var(--accent); }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
label small { font-size: 12px; }
label.check { display: flex; align-items: flex-start; gap: 8px; }
label.check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
input { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 500; border-radius: 8px; padding: 10px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: var(--surface); color: var(--muted); font-weight: 400; padding: 8px; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 400; justify-self: start; text-decoration: underline; }
#msg { min-height: 1.4em; color: var(--warn); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>美股持仓账本</h1>
  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" data-mode="login" aria-selected="true">登录</button>
    <button type="button" role="tab" data-mode="register" aria-selected="false">注册</button>
  </div>
  <p id="lede"></p>
  <form id="f" novalidate>
    <div style="display: grid; gap: 14px">
      <label>用户名<input id="name" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
        <small data-for="register">2–20 个字，可以用字母、数字、下划线或汉字。</small></label>
      <label data-for="reset">重置码<input id="code" autocomplete="one-time-code" spellcheck="false" maxlength="20"></label>
      <label><span id="pwLbl">密码</span><input id="pw" type="password" autocomplete="current-password" maxlength="128" required></label>
      <label data-for="register reset">再输入一次密码<input id="pw2" type="password" autocomplete="new-password" maxlength="128"></label>
      <label class="check" data-for="register"><input id="agree" type="checkbox"><span>我已阅读并同意<a href="/privacy" target="_blank" rel="noopener">隐私说明</a>。</span></label>
      <button type="submit" id="go">登录</button>
      <p id="msg" role="status"></p>
      <button type="button" class="link" id="forgot" data-for="login">忘记密码？</button>
      <button type="button" class="link" id="back" data-for="reset">← 回到登录</button>
    </div>
  </form>
</main>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  const H = { "Content-Type": "application/json", "X-Requested-With": "ledger" };
  const LEDE = {
    login: "用用户名和密码登录。",
    register: "注册后，你的记录只有你自己能看到。",
    reset: "忘记密码时，请联系网站管理员获取重置码（24 小时内有效），再在这里设置新密码。",
  };
  let mode = "login", registration = true;
  function setMode(m) {
    mode = m;
    document.querySelectorAll("[data-for]").forEach((el) => { el.hidden = !el.dataset.for.split(" ").includes(m); });
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
    $("#tabs").hidden = m === "reset" || !registration;
    $("#lede").textContent = LEDE[m];
    $("#pwLbl").textContent = m === "login" ? "密码" : m === "register" ? "密码（至少 8 位）" : "新密码（至少 8 位）";
    $("#pw").autocomplete = m === "login" ? "current-password" : "new-password";
    $("#go").textContent = m === "login" ? "登录" : m === "register" ? "注册并进入" : "设置新密码并进入";
    $("#msg").textContent = "";
  }
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  $("#forgot").addEventListener("click", () => setMode("reset"));
  $("#back").addEventListener("click", () => setMode("login"));
  setMode("login");

  try {
    const a = await (await fetch("/api/auth", { credentials: "same-origin" })).json();
    if (a.authed) { location.reload(); return; }
    registration = a.registration !== false;
    setMode("login");
  } catch (e) { $("#msg").textContent = "连不上服务器，稍后再试。"; }
  // The session cookie is Secure: browsers only keep it over HTTPS (or on localhost).
  if (!window.isSecureContext) {
    $("#msg").textContent = "登录需要 HTTPS：请用 https:// 地址打开（在服务器本机测试可以用 http://localhost）。";
    $("#go").disabled = true;
    return;
  }
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("#name").value.trim(), pw = $("#pw").value, fresh = mode !== "login";
    if (!name) { $("#msg").textContent = "请输入用户名。"; return; }
    if (mode === "reset" && !$("#code").value.trim()) { $("#msg").textContent = "请输入重置码。"; return; }
    if (!pw) { $("#msg").textContent = "请输入密码。"; return; }
    if (fresh && pw.length < 8) { $("#msg").textContent = "密码至少 8 位。"; return; }
    if (fresh && pw !== $("#pw2").value) { $("#msg").textContent = "两次输入的密码不一样。"; return; }
    if (mode === "register" && !$("#agree").checked) { $("#msg").textContent = "请先阅读并勾选同意隐私说明。"; return; }
    $("#go").disabled = true; $("#msg").textContent = "";
    try {
      const body = mode === "login" ? { name, password: pw }
        : mode === "register" ? { name, password: pw, agree: true }
        : { name, code: $("#code").value.trim(), password: pw };
      const r = await fetch("/api/" + mode, { method: "POST", headers: H, credentials: "same-origin", body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { location.reload(); return; }
      $("#msg").textContent = j.error || "没成功，稍后再试。";
    } catch (err) {
      $("#msg").textContent = "连不上服务器，稍后再试。";
    }
    $("#go").disabled = false;
  });
})();
</script>
</body>
</html>
