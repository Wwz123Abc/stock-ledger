<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>账号 · 美股持仓账本</title>
<style>
/* Layout: one column of cards: change password, export records, delete the account */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --ink: #16202A; --muted: #5D6A77; --line: #D3DAE1;
  --accent: #2B5784; --on-accent: #FFFFFF; --warn: #9A6400; --danger: #B3261E;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161C; --surface: #19212A; --ink: #E5EAF0; --muted: #95A2AF; --line: #2B3540; --accent: #82ABDA; --on-accent: #0E1620; --warn: #E0A84A; --danger: #F2827A; color-scheme: dark; }
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px 56px; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 26px; font-weight: 600; }
h2 { margin: 0; font-size: 17px; font-weight: 600; }
p { margin: 0; color: var(--muted); font-size: 13px; }
a { color: var(--accent); }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
label.check { display: flex; align-items: flex-start; gap: 8px; }
label.check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; }
input { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 500; border-radius: 8px; padding: 9px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; justify-self: start; }
button.danger { border-color: var(--danger); background: none; color: var(--danger); }
button:disabled { opacity: .6; cursor: default; }
.msg { min-height: 1.2em; }
.msg[data-kind="ok"] { color: var(--accent); }
.msg[data-kind="err"] { color: var(--warn); }
</style>
</head>
<body>
<main>
  <div>
    <p><a href="/">← 回到美股持仓账本</a></p>
    <h1>账号</h1>
    <p id="who">正在读取…</p>
  </div>

  <section aria-labelledby="pw-h">
    <h2 id="pw-h">修改密码</h2>
    <form id="pwForm" novalidate style="display: grid; gap: 12px">
      <label>原密码<input id="old" type="password" autocomplete="current-password" maxlength="128"></label>
      <label>新密码（至少 8 位）<input id="new1" type="password" autocomplete="new-password" maxlength="128"></label>
      <label>再输入一次新密码<input id="new2" type="password" autocomplete="new-password" maxlength="128"></label>
      <button type="submit">修改密码</button>
      <p class="msg" id="pwMsg" role="status">改完后，其他设备上的登录会退出。</p>
    </form>
  </section>

  <section aria-labelledby="ex-h">
    <h2 id="ex-h">导出数据</h2>
    <p>下载你的全部记录（交易、国债和定期存款、设置、读书笔记），保存为一个 JSON 文件。这个文件也可以导入自己部署的<a href="https://github.com/Wwz123Abc/stock-ledger" target="_blank" rel="noopener">开源版本</a>。</p>
    <button type="button" id="exportBtn">下载我的数据</button>
    <p class="msg" id="exMsg" role="status"></p>
  </section>

  <section aria-labelledby="del-h">
    <h2 id="del-h">注销账号</h2>
    <p>注销后，你的账号和全部记录会立即删除，无法恢复。建议先导出数据。</p>
    <form id="delForm" novalidate style="display: grid; gap: 12px">
      <label>输入密码确认<input id="delPw" type="password" autocomplete="current-password" maxlength="128"></label>
      <label class="check"><input id="delOk" type="checkbox"><span>我明白注销后所有记录都会删除，无法恢复。</span></label>
      <button type="submit" class="danger">注销账号</button>
      <p class="msg" id="delMsg" role="status"></p>
    </form>
  </section>

  <p><a href="/privacy">隐私说明</a></p>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const H = { "Content-Type": "application/json", "X-Requested-With": "ledger" };
  const say = (el, text, kind) => { el.textContent = text; el.dataset.kind = kind || ""; };
  async function api(method, url, body) {
    const r = await fetch(url, { method, headers: H, credentials: "same-origin", body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && url !== "/api/password" && url !== "/api/account/delete") { location.href = "/"; throw new Error("请先登录。"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "没成功，稍后再试。");
    return j;
  }
  let name = "";
  api("GET", "/api/auth").then((a) => {
    if (!a.authed) { location.href = "/"; return; }
    name = a.name;
    $("#who").textContent = "用户名：" + a.name;
  }).catch(() => { $("#who").textContent = "连不上服务器，刷新页面试试。"; });

  $("#pwForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#pwMsg"), n1 = $("#new1").value;
    if (!$("#old").value) return say(msg, "请输入原密码。", "err");
    if (n1.length < 8) return say(msg, "新密码至少 8 位。", "err");
    if (n1 !== $("#new2").value) return say(msg, "两次输入的新密码不一样。", "err");
    try {
      await api("POST", "/api/password", { old: $("#old").value, password: n1 });
      e.target.reset();
      say(msg, "密码已修改。", "ok");
    } catch (err) { say(msg, err.message, "err"); }
  });

  $("#exportBtn").addEventListener("click", async () => {
    const msg = $("#exMsg");
    try {
      const data = await api("GET", "/api/export");
      const n = Object.values(data).reduce((t, docs) => t + Object.keys(docs).length, 0);
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: "美股持仓账本-" + name + "-" + new Date().toISOString().slice(0, 10) + ".json" });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      say(msg, "已导出 " + n + " 条记录。", "ok");
    } catch (err) { say(msg, err.message, "err"); }
  });

  $("#delForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#delMsg");
    if (!$("#delPw").value) return say(msg, "请输入密码。", "err");
    if (!$("#delOk").checked) return say(msg, "请先勾选确认。", "err");
    try {
      await api("POST", "/api/account/delete", { password: $("#delPw").value });
      location.href = "/";
    } catch (err) { say(msg, err.message, "err"); }
  });
})();
</script>
</body>
</html>
